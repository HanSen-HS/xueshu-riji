{% extends "base.html" %}
{% block title %}登录 · 学术日志{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">📚</div>
    <h1 class="auth-title">学术日志</h1>
    <p class="auth-sub">登录以继续</p>

    <!-- 邮箱+密码 -->
    <form method="POST" action="{{ url_for('login_page') }}" class="auth-form">
      <div class="form-group">
        <label class="form-label">邮箱地址</label>
        <input type="email" name="email" class="form-input"
               placeholder="支持 163、QQ、Gmail、Outlook 等所有邮箱" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" name="password" class="form-input"
               placeholder="请输入密码" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>

    <div class="auth-divider"><span>没有账号？</span></div>
    <a href="{{ url_for('register') }}" class="btn btn-outline btn-block">注册新账号</a>

    <!-- OAuth 登录（可选，需科学上网） -->
    {% if has_google or has_ms %}
    <div class="auth-divider"><span>或使用第三方登录（需科学上网）</span></div>
    <div class="oauth-buttons">
      {% if has_google %}
      <a href="{{ url_for('google_login') }}" class="btn btn-oauth">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.34-8.16 2.34-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Google 登录
      </a>
      {% endif %}
      {% if has_ms %}
      <a href="{{ url_for('ms_login') }}" class="btn btn-oauth">
        <svg width="18" height="18" viewBox="0 0 21 21">
          <rect x="1"  y="1"  width="9" height="9" fill="#f25022"/>
          <rect x="11" y="1"  width="9" height="9" fill="#7fba00"/>
          <rect x="1"  y="11" width="9" height="9" fill="#00a4ef"/>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        Microsoft 登录
      </a>
      {% endif %}
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
